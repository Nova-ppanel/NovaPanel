<!DOCTYPE html>
<html>
<head>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
<input id="u" placeholder="Usuario"><br>
<input id="p" type="password" placeholder="Contraseña"><br>
<button id="b">Entrar</button>
<p id="e"></p>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBsYxEHoS9ta6efEYfAKKOa82r_g4LEbmg",
    authDomain: "novapanel-2d72b.firebaseapp.com",
    projectId: "novapanel-2d72b",
    storageBucket: "novapanel-2d72b.appspot.com",
    messagingSenderId: "317388043186",
    appId: "1:317388043186:web:3fc4f4c8d63b1c92e5e1ab"
};
firebase.initializeApp(firebaseConfig);
const a=firebase.auth();
document.getElementById('b').onclick=function(){
var u=document.getElementById('u').value;
var p=document.getElementById('p').value;
if(u==='admin')u='admin@admin.com';
a.signInWithEmailAndPassword(u,p)
.then(function(){document.getElementById('e').innerHTML='<b style=color:green>ENTRASTE</b>';})
.catch(function(x){document.getElementById('e').innerHTML='<b style=color:red>ERROR: '+x.message+'</b>';});
};
</script>
</body>
</html>
