        <div id="csTimer" style="font-family:monospace;background:#fff;color:#000;border-radius:99px;padding:8px 16px;display:inline-block;">Cerrando en 15s...</div>
        <div style="margin-top:10px;font-size:11px;color:#666;">Anuncio real de Google aparecerá aquí cuando publiques la app</div>
      </div>
    `;
    document.body.appendChild(ov);
    try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
    let s=15;
    const it = setInterval(()=>{
      s--;
      const el = document.getElementById('csTimer');
      if(el) el.textContent = s<=0 ? 'Continuar →' : `Cerrando en ${s}s...`;
      if(s<=0){ clearInterval(it); el.style.background='#4CAF50'; el.style.color='#fff'; el.style.cursor='pointer'; el.onclick=()=>ov.remove(); }
    },1000);
  };
  
  // Interceptar cualquier guardado
  const checkProducts = ()=>{
    try{
      const prods = JSON.parse(localStorage.getItem('casastock_products')||localStorage.getItem('products')||'[]');
      if(Array.isArray(prods)){
        const len = prods.length;
        const lastLen = parseInt(localStorage.getItem('_csLastLen')||'0');
        if(len>lastLen && len%3===0){
          setTimeout(window._csShowAd, 800);
        }
        localStorage.setItem('_csLastLen', len);
      }
    }catch(e){}
  };
  setInterval(checkProducts, 1000);
  
  // Exponer para prueba manual
  window.probarAnuncio = window._csShowAd;
})();
</script>
